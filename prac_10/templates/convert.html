<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Convert Celsius</title>
</head>
<body>
    <h1>Celsius to Fahrenheit Converter</h1>
    <form method="post">
        <label for="celsius">Enter temperature (°C):</label>
        <input type="text" id="celsius" name="celsius" required>
        <input type="submit" value="Convert">
    </form>
    {% if celsius is defined and fahrenheit is defined %}
        <p>{{ celsius }}°C is {{ fahrenheit }}°F</p>
    {% elif error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <p><a href="/">Back to Home</a></p>
</body>
</html>
